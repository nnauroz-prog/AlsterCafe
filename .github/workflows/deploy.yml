name: Live-Seite aktualisieren

# Bei jedem Push auf die Arbeitsbranche wird der Stand automatisch
# in den gh-pages-Branch gespiegelt. GitHub Pages (Modus "Deploy from
# branch", Branch gh-pages) liefert dann sofort die neue Version aus.
on:
  push:
    branches:
      - "claude/bakery-website-redesign-vyyXQ"
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gh-pages-sync"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nach gh-pages spiegeln
        run: |
          git push origin HEAD:gh-pages --force
