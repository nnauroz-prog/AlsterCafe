name: Deploy zu GitHub Pages

# Loest sich aus bei jedem Push auf main oder die Arbeitsbranche
on:
  push:
    branches:
      - main
      - "claude/bakery-website-redesign-vyyXQ"
  workflow_dispatch:

# Benoetigte Rechte fuer GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Nicht parallel deployen
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen (statische Dateien)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
